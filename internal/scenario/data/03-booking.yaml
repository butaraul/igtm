          +import { db } from "@/lib/db";
          +
          +export const PACK_SIZE = 10;
          +
          +// Called from the webhook; conditional on the pack still being unpaid.
          +export async function creditPack(packId: string, sessionId: string) {
          +  await db.classPack.updateMany({ where: { id: packId, stripeSessionId: sessionId, credits: 0 }, data: { credits: PACK_SIZE } });
          +}
          +
          +export async function spendCredit(packId: string, email: string) {
          +  const spent = await db.classPack.updateMany({
          +    where: { id: packId, email, credits: { gt: 0 }, expiresAt: { gt: new Date() } },
          +    data: { credits: { decrement: 1 } },
