id: landing
title: Landing page with a contact form
difficulty: 1
summary: A plumber wants a website by Friday. One form, one phone number, no surprises.

client:
  name: Gus Okafor
  role: Owner, Okafor & Daughters Plumbing, Leeds
  about: Runs the business from a van. Answers email at red lights. His daughter Ife does the books and has opinions about websites.

brief: |
  We need a website. Make it pop, but keep it simple, my customers are not
  computer people. They need to be able to get hold of us from it. Ife says
  it has to work on phones because that's all anyone uses. Can it be up by
  Friday? We had a site in 2011 and it was fine.

requirements:
  - id: page
    text: A page that says who they are and what they do
  - id: contact
    text: Contact form that reaches the office inbox
    weight: 2
  - id: phone
    text: Phone number visible on phones
  - id: mobile
    text: Works on phones

budget:
  clock: 330
  tokens: 300000
  context: 48000

turns:
